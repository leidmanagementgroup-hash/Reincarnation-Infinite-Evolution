<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091b20">
<title>Reincarnation — Infinite Evolution</title>
<link rel="icon" href="data:,">
<style>/*__STYLE__*/</style>
</head>
<body>
<main id="console">
  <section id="titleScreen" aria-label="Menu principale">
    <div class="cover"></div><div class="shade"></div><div id="motes" aria-hidden="true"></div>
    <header class="mast"><span class="rune crest" data-symbol="crest" aria-hidden="true"></span><span>CRONACHE DI LÙMORA</span><i></i></header>
    <div class="tools titleTools"><button data-do="audio" aria-label="Attiva audio" title="Audio"><i data-symbol="mute"></i></button><button data-do="full" aria-label="Schermo intero" title="Schermo intero"><i data-symbol="full"></i></button></div>
    <div class="heroMenu">
      <div class="filigree" aria-hidden="true"><b></b><i></i><u></u><i></i><b></b></div>
      <h1>Reincarnation</h1>
      <div class="subtitle"><span></span>Infinite Evolution<span></span></div>
      <p class="story">Rinasci a Lùmora. Il modo in cui vivi<br class="desktop"> determina la creatura che diventerai.</p>
      <nav class="titleNav" aria-label="Partita">
        <button id="playBtn" class="menuPrimary" data-do="new"><i data-symbol="spark"></i><span>Nuova incarnazione</span><i data-symbol="arrow"></i></button>
        <button id="otherPlay" class="menuSecondary" data-do="new" hidden><i data-symbol="spark"></i><span>Nuova incarnazione</span></button>
        <button class="menuSecondary" data-do="lineages"><i data-symbol="book"></i><span>Grimorio delle stirpi</span></button>
        <button class="menuSecondary" data-do="settings"><i data-symbol="settings"></i><span>Opzioni e comandi</span></button>
      </nav>
    </div>
    <div class="titleFoot"><div class="navHint"><kbd>↑</kbd><kbd>↓</kbd> Naviga <em></em><kbd>INVIO</kbd> Conferma</div><div class="chapter"><span>CAMPAGNA</span><strong>Dal Borgo al Varco</strong></div></div>
  </section>
  <section id="playScreen" hidden aria-label="Esplorazione">
    <canvas id="field" aria-label="Mondo di Lùmora" tabindex="0"></canvas>
    <div class="status pane"><button id="avatar" data-do="character" title="Personaggio (C)"><canvas width="56" height="56"></canvas></button><div class="vitals"><div class="vitalTitle"><strong id="formName"></strong><b id="level"></b></div><div class="bars"><div class="bar hp"><i></i><span></span></div><div class="bar mp"><i></i><span></span></div></div><div class="xp" role="img"><i></i></div><div id="needs" aria-live="polite"></div></div></div>
    <div class="mapCorner"><button class="minimap pane" data-do="map" title="Mappa della regione (M)"><canvas id="mini" width="160" height="95"></canvas><span id="location"></span></button><span id="clock"></span></div>
    <button id="questHint" class="quest pane" data-do="journal"><span class="cap" id="questChapter">MISSIONE PRINCIPALE</span><strong id="questTitle"></strong><span id="questText"></span><span id="questRoute" hidden><b aria-hidden="true"></b><span></span></span></button>
    <div id="bossHud" hidden><strong></strong><div><i></i></div><span></span></div>
    <div id="interaction" hidden><button data-action="interact"><kbd>E</kbd> <span></span></button></div>
    <div id="placementBar" class="pane" hidden><span>Posiziona nel lotto · clic o Invio</span><button class="btn" data-do="cancelPlacement">Annulla</button></div>
    <div class="gameBottom"><div class="tools playTools"><button data-do="pause" aria-label="Pausa" title="Pausa (Esc)"><i data-symbol="pause"></i></button><button data-do="inventory" aria-label="Inventario" title="Inventario (I)"><i data-symbol="bag"></i></button><button data-do="skills" aria-label="Abilità" title="Abilità (K)"><i data-symbol="spark"></i></button><button class="helpBtn" data-do="help" aria-label="Guida di gioco" title="Guida di gioco (H)">?</button></div><div id="hotbar"></div><button id="evoAlert" hidden data-do="evolution">Evoluzione disponibile ✦</button></div>
    <div id="directionPad" aria-label="Movimento touch"><button data-dir="up" aria-label="Su">▴</button><button data-dir="left" aria-label="Sinistra">◂</button><button data-dir="down" aria-label="Giù">▾</button><button data-dir="right" aria-label="Destra">▸</button></div>
    <div id="zoneBanner" aria-live="off"></div>
  </section>
  <aside id="veil" hidden><section id="dialog" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><div id="panelTop"><div><span class="cap" id="panelKicker"></span><h2 id="panelTitle"></h2></div><button id="xPanel" class="square" data-do="close" aria-label="Chiudi"><i data-symbol="close"></i></button></div><div id="tabs"></div><div id="panelBody"></div></section></aside>
  <div id="toast" role="status"></div>
  <input type="file" accept=".json,application/json" id="saveFile" hidden>
</main>
<script>/*__SCRIPTS__*/</script>
</body>
</html>
